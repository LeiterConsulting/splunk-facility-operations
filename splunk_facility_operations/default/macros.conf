[facility_ops_demo_events(3)]
args = vertical, usecase, clock
definition = inputlookup facility_ops_demo_cycle.csv | search vertical=$vertical$ usecase=$usecase$ | eval phase=tonumber(phase), scenario_age=(($clock$-(phase*45))%360+360)%360, _time=now()-scenario_age, origin="demo", evidence_at=if(state="unknown",_time-3600,_time)
iseval = 0

[facility_ops_live_events]
definition = index=facility_ops_live sourcetype=facility_ops:telemetry origin=live
iseval = 0
